name: Catalogue crawl

# Manual only, deliberately.
#
# This ran daily at 09:00 UTC and failed every morning, mailing a failure
# notice each time. A daily alert that always fires teaches you to ignore
# alerts, which is worse than having none — so the schedule is off until
# someone asks for it back.
#
# To restore it, uncomment the schedule block below. Nothing else is needed;
# the failure it used to produce is fixed (see node-version).
#
# Note the trade-off being accepted: trend history only accumulates on days
# this runs, and a missed day is a permanent hole — snapshots cannot be
# backfilled from a site that has already changed its prices.
on:
  # schedule:
  #   - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch:
    inputs:
      brand:
        description: 'Brand slug (blank = all active sites)'
        required: false
        default: ''
      country:
        description: 'Country code (blank = all)'
        required: false
        default: ''
      dry_run:
        description: 'Fetch and normalize without writing'
        type: boolean
        default: false

concurrency:
  # Never let two crawls of the same site overlap: both would write snapshots
  # for the same day and the diff stage would compare against a partial run.
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Not 20. undici 8 calls worker_threads.markAsUncloneable, which does
          # not exist before 22.19, so every scheduled run died in `npm test`
          # with "webidl.util.markAsUncloneable is not a function" — long before
          # it reached the crawl. supabase-js warns off Node 20 for the same
          # generation of reasons. Keep this at or above the engines floor in
          # package.json.
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Fail here rather than inside the crawl, where an absent secret surfaces
      # as an opaque connection error several minutes into a run.
      - name: Check credentials are configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY must be set as repository secrets before a crawl can run."
            exit 1
          fi

      - name: Crawl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWL_USER_AGENT: ${{ vars.CRAWL_USER_AGENT }}
          LOG_LEVEL: info
        run: |
          ARGS="--scheduled"
          if [ -n "${{ github.event.inputs.brand }}" ]; then ARGS="$ARGS --brand ${{ github.event.inputs.brand }}"; fi
          if [ -n "${{ github.event.inputs.country }}" ]; then ARGS="$ARGS --country ${{ github.event.inputs.country }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          npx tsx src/cli.ts crawl $ARGS

      # Exit code 1 means partial: some collections failed but the run wrote
      # data. That is worth seeing in the log without failing the workflow and
      # triggering an alert for something self-healing.
      - name: Flag partial run
        if: ${{ failure() }}
        run: echo "::warning::Crawl finished partial or failed — check crawl_errors for this run_id"
